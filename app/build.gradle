plugins {
    id 'com.android.application'
}

android {
    namespace 'com.donaldlad.vpn'
    compileSdk 36

    defaultConfig {
        applicationId 'com.donaldlad.vpn'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.wireguard.android:tunnel:1.0.20230706'
}
