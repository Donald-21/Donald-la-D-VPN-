plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv("SIGNING_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("SIGNING_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("SIGNING_KEY_ALIAS")
def releaseKeyPassword = System.getenv("SIGNING_KEY_PASSWORD")
def hasReleaseSigning = releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.donaldlad.vpn'
    compileSdk 36

    defaultConfig {
        applicationId 'com.donaldlad.vpn'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.wireguard.android:tunnel:1.0.20230706'
}
