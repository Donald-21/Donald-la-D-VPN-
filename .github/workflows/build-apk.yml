name: Build DONALD LA D VPN APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare release signing key
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' && env.SIGNING_STORE_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' && env.SIGNING_KEY_PASSWORD != '' }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/donald-release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/donald-release.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$SIGNING_STORE_PASSWORD"
          echo "::add-mask::$SIGNING_KEY_PASSWORD"

      - name: Build signed release APK
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' && secrets.SIGNING_STORE_PASSWORD != '' && secrets.SIGNING_KEY_ALIAS != '' && secrets.SIGNING_KEY_PASSWORD != '' }}
        run: gradle assembleRelease

      - name: Build debug APK (signing secrets not configured)
        if: ${{ env.SIGNING_KEYSTORE_BASE64 == '' || env.SIGNING_STORE_PASSWORD == '' || env.SIGNING_KEY_ALIAS == '' || env.SIGNING_KEY_PASSWORD == '' }}
        run: gradle assembleDebug

      - name: Upload signed release APK
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' && secrets.SIGNING_STORE_PASSWORD != '' && secrets.SIGNING_KEY_ALIAS != '' && secrets.SIGNING_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: DONALD-LA-D-VPN-release-signed
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 == '' || secrets.SIGNING_STORE_PASSWORD == '' || secrets.SIGNING_KEY_ALIAS == '' || secrets.SIGNING_KEY_PASSWORD == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: DONALD-LA-D-VPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
